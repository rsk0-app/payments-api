apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-payments-api
  labels:
    app: payments-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payments-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: MEM_FOOTPRINT_MB
              value: {{ .Values.env.MEM_FOOTPRINT_MB | quote }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: FAILURE_MODE
              value: {{ .Values.failure.mode | quote }}
            - name: ERROR_RATE
              value: {{ .Values.failure.errorRate | quote }}
            - name: LATENCY_MS
              value: {{ .Values.failure.latencyMs | quote }}
          # Liveness stays SHALLOW (/healthz): the process being up == alive, so
          # a transient DB blip must not get the pod killed. Readiness is DEEP
          # (/readyz): payments-api is the LEAF of the chain, so /readyz runs a
          # real DB SELECT 1 (R2) — a broken DB flips this pod NotReady and the
          # upstream /readyz deep-checks cascade the outage all the way up.
          resources:
{{ toYaml .Values.resources | indent 12 }}
