replicaCount: 2
image:
  repository: ghcr.io/rsk0-app/payments-api
  tag: "latest"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
env:
  NODE_ENV: production
  LOG_LEVEL: info
failure:
  mode: ""
  errorRate: "0.5"
  latencyMs: "1500"
