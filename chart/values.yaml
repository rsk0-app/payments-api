replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/payments-api
  tag: broken-nonexistent-payments-api
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
resources:
  limits: {}
  requests:
    cpu: 100m
    memory: 128Mi
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PAYMENTS_TIMEOUT_MS: "250"
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
