replicaCount: 2
image:
  repository: ghcr.io/rsk0-app/payments-api
  tag: 258133241a9099a956163862dc4b5cbfaddfb1a8
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PAYMENTS_TIMEOUT_MS: "250"
  # R3: real load-driven memory footprint (MiB). Under loadgen the RSS plateaus
  # at ~this value; the baseline limits.memory (256Mi) sits comfortably above
  # footprint+runtime, so it is healthy at baseline but OOMKilled if a risky
  # change lowers limits.memory below the footprint (set_low_memory_limit -> 128Mi).
  MEM_FOOTPRINT_MB: "150"
database:
  url: postgres://stand:standpass@postgres.rsk0-apps.svc.cluster.local:5432/stand
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
