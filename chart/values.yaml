replicaCount: 2
image:
  repository: ghcr.io/rsk0-app/payments-api
  tag: 1efb0a4ba1c1cef5c625b2e2d71a6266560ac702
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PAYMENTS_TIMEOUT_MS: "250"
  MEM_FOOTPRINT_MB: "150"
database:
  url: postgres://stand:standpass@postgres.rsk0-apps.svc.cluster.local:5432/stand
failure:
  mode: "errors"
  errorRate: "0.3"
  latencyMs: "0"
